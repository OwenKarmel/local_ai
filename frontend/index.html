<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sketch2Game</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #1e1f26; color: #e6e6e6; }
    #app { display: flex; gap: 12px; padding: 12px; height: 100vh; }
    #left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    #game { border-radius: 6px; overflow: hidden; }
    #game canvas { display: block; max-width: 100%; }
    #help { font-size: 13px; color: #9aa; }
    #panel { width: 340px; background: #272934; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    #panel h2 { margin: 0; font-size: 16px; }
    #log { flex: 1; overflow-y: auto; font: 12px ui-monospace, monospace; background: #1b1c22; border-radius: 4px; padding: 8px; }
    #log .entry { margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
    #log .error { color: #ff7b7b; } #log .ok { color: #8be28b; } #log .info { color: #aab; }
    button { background: #3b3f52; color: #eee; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #4b5068; }
    #stage-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    #stage-bar button.active { background: #2f6f46; }
    /* voice */
    #left { position: relative; }
    #listen-badge { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px;
      font: 700 20px -apple-system, system-ui, sans-serif; color: #fff; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 5; }
    #listen-badge.show { opacity: 1; }
    #listen-badge.listening { background: #e0283c; animation: pulse 1s infinite; }
    #listen-badge.working { background: #3b4bd8; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(224,40,60,.25); } }
    #talk-btn { font-size: 17px; font-weight: 700; padding: 14px; background: #2f6f46; user-select: none; touch-action: none; }
    #talk-btn.recording { background: #e0283c; }
    #mic-meter { height: 8px; background: #1b1c22; border-radius: 4px; overflow: hidden; }
    #mic-level { height: 100%; width: 0%; background: #4cd964; transition: width .05s; }
    #voice-status { font-size: 13px; color: #cfd2e0; min-height: 1.2em; }
    #voice-status.listening { color: #ff6b7a; font-weight: 700; }
    #voice-status.error { color: #ff7b7b; }
    #voice-heard { font-size: 14px; color: #fff; min-height: 1.2em; }
    #voice-reply { font-size: 13px; color: #8be28b; min-height: 1.2em; }
    #voice-reply.refused, #voice-reply.error { color: #ff7b7b; }
    #flag-btn { font-size: 12px; padding: 2px 8px; margin-top: 4px; }
    #cmd-form { display: flex; gap: 6px; margin-top: 6px; }
    #text-cmd summary { cursor: pointer; font-size: 13px; color: #9aa; }
    #text-cmd[open] summary { margin-bottom: 6px; }
    .log2 { height: 160px; overflow-y: auto; font: 12px ui-monospace, monospace; background: #1b1c22; border-radius: 4px; padding: 8px; }
    .log2 .entry { margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
    .log2 .error { color: #ff7b7b; } .log2 .ok { color: #8be28b; } .log2 .info { color: #aab; }
    #cmd-input { flex: 1; background: #1b1c22; color: #eee; border: 1px solid #3b3f52; border-radius: 4px; padding: 7px 8px; font-size: 14px; }
    /* ---------- demo video mode (demo.js): only the game, a small mic, a caption ---------- */
    #mini-mic, #caption { display: none; }
    body.demo { background: #000; overflow: hidden; }
    body.demo #panel, body.demo #help { display: none; }
    body.demo #app { padding: 0; gap: 0; height: 100vh; }
    body.demo #left { width: 100vw; height: 100vh; align-items: center; justify-content: center; }
    body.demo #game { border-radius: 0; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
    body.demo #game canvas { width: min(100vw, 200vh) !important; height: min(50vw, 100vh) !important; max-width: none; }
    body.demo #mini-mic { display: block; position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
      font-size: 24px; padding: 0; background: rgba(20, 22, 30, .55); border: 2px solid rgba(255,255,255,.35); opacity: .8;
      user-select: none; touch-action: none; z-index: 20; }
    body.demo #mini-mic:hover { opacity: 1; }
    body.demo #mini-mic.recording { background: #e0283c; border-color: #fff; opacity: 1; }
    body.demo #caption { display: block; position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: 70vw;
      text-align: center; font: 600 20px -apple-system, system-ui, sans-serif; color: #fff; opacity: 0; transition: opacity .3s;
      text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; z-index: 20; }
    body.demo #caption.show { opacity: 1; }
    body.demo #caption .heard { font-size: 22px; }
    body.demo #caption .reply { font-size: 16px; font-weight: 500; color: #b8f5c0; margin-top: 4px; }
    body.demo #caption .reply.refused, body.demo #caption .reply.error { color: #ffb3b3; }
  </style>
</head>
<body>
  <div id="app">
    <div id="left">
      <div id="game"></div>
      <div id="listen-badge"></div>
      <button id="mini-mic" title="Hold to talk (or hold V)">🎙</button>
      <div id="caption"></div>
      <div id="help">Arrows/WASD move · Space/Up/W jump · R restart · <b>hold V to talk</b></div>
    </div>
    <div id="panel">
      <h2>Sketch2Game</h2>
      <button id="talk-btn">🎙 Hold to talk (or hold V)</button>
      <div id="mic-meter"><div id="mic-level"></div></div>
      <div id="voice-status"></div>
      <div id="voice-heard"></div>
      <div id="voice-reply"></div>
      <button id="flag-btn" hidden title="Save this command as a failure case (backend/data/traces/)">👎 Wrong result</button>
      <details id="text-cmd">
        <summary>⌨ Type a command instead</summary>
        <div id="cmd-out" class="log2"></div>
        <form id="cmd-form"><input id="cmd-input" placeholder="e.g. lower the gravity" autocomplete="off"><button type="submit">Send</button></form>
      </details>
      <div id="stage-bar"></div>
      <div><button id="reset-btn">Reset this level</button> <button id="demo-btn" title="Shift+D toggles, Esc exits">🎬 Demo mode</button></div>
      <div id="log"></div>
    </div>
  </div>
  <script src="vendor/phaser.min.js"></script>
  <script src="mechanics.js"></script>
  <script src="sprites.js"></script>
  <script src="looks.js"></script>
  <script src="game.js"></script>
  <script src="voice.js"></script>
  <script src="testwin.js"></script>
  <script src="demo.js"></script>
</body>
</html>
